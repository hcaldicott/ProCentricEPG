<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPG Admin Login</title>
  <script>
    (function () {
      const stored = window.localStorage.getItem("epgAdminTheme");
      const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (dark ? "dark" : "light"));
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bulma.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-theme.css') }}" />
</head>
<body>
  <section class="section">
    <div class="container is-max-desktop">
      <div class="is-flex is-justify-content-flex-end mb-4">
        <button class="button is-small is-light epg-theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
          <span class="icon is-small" data-theme-icon data-current-icon="moon" aria-hidden="true">
            <i data-lucide="moon"></i>
          </span>
        </button>
      </div>
      <div class="columns is-centered">
        <div class="column is-5-desktop is-7-tablet">
          <div class="box">
            <h1 class="title is-3 mb-2">EPG Admin</h1>
            <p class="subtitle is-6 mb-5">Sign in with an existing admin account.</p>
            {% if error %}
            <div class="notification is-danger is-light">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('admin_login') }}">
              <div class="field">
                <label class="label">Username</label>
                <div class="control">
                  <input class="input" type="text" name="username" required autocomplete="username" />
                </div>
              </div>
              <div class="field">
                <label class="label">Password</label>
                <div class="control">
                  <input class="input" type="password" name="password" required autocomplete="current-password" />
                </div>
              </div>
              <div class="field mt-5">
                <div class="control">
                  <button type="submit" class="button is-primary is-fullwidth">Sign In</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="{{ url_for('static', filename='vendor/lucide.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme-tools.js') }}"></script>
</body>
</html>
