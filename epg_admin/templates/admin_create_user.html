<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Customer</title>
  <script>
    (function () {
      const stored = window.localStorage.getItem("epgAdminTheme");
      const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (dark ? "dark" : "light"));
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bulma.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bulma-toast.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bulma-tooltip.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-theme.css') }}" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>
<body>
  <div class="modal is-active" id="create-user-modal">
    <a class="modal-background" href="{{ url_for('admin_users') }}" aria-label="Close"></a>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Create Customer FTP User</p>
        <a href="{{ url_for('admin_users') }}" class="delete" aria-label="Close"></a>
      </header>
      <section class="modal-card-body">
        {% if error %}
        <div class="notification is-danger is-light">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('admin_create_user') }}" id="create-user-form">
          <div class="field">
            <label class="label">
              Description
              <span class="tooltip-inline">
                <button type="button" class="tooltip-trigger" aria-label="Description help">
                  <span class="icon is-small">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                  </span>
                </button>
                <span class="tooltip-bubble" role="tooltip">
                  Optional account description shown in the users table. Not used for login.
                </span>
              </span>
            </label>
            <div class="control">
              <input class="input" type="text" name="label" autocomplete="organization" />
            </div>
          </div>

          <div class="field">
            <label class="label">Username <span class="has-text-danger">*</span></label>
            <div class="control">
              <input class="input" type="text" name="username" required autocomplete="username" />
            </div>
          </div>

          <div class="field">
            <label class="label">Password <span class="has-text-danger">*</span></label>
            <div class="field has-addons">
              <div class="control is-expanded">
                <input class="input" type="password" name="password" id="password-input" autocomplete="new-password" required />
              </div>
              <div class="control">
                <button type="button" class="button is-info is-light" id="generate-password-btn">Generate</button>
              </div>
            </div>
          </div>
        </form>
      </section>
      <footer class="modal-card-foot">
        <div class="buttons">
          <button type="submit" form="create-user-form" class="button is-primary">Create User</button>
          <a href="{{ url_for('admin_users') }}" class="button">Cancel</a>
        </div>
      </footer>
    </div>
  </div>

  <div id="copy-toast" class="notification is-success is-light toast-corner is-hidden" role="status" aria-live="polite">
    <button class="delete" type="button" id="copy-toast-close" aria-label="Dismiss"></button>
    <span id="copy-toast-message">Generated password copied to clipboard.</span>
  </div>

  <script src="{{ url_for('static', filename='js/toast-tools.js') }}"></script>
  <script src="{{ url_for('static', filename='js/password-tools.js') }}"></script>
  <script>
    (function () {
      window.EPGPasswordTools.initPasswordGenerator({
        passwordInputId: "password-input",
        generateButtonId: "generate-password-btn",
        toastId: "copy-toast",
        toastMessageId: "copy-toast-message",
        toastCloseId: "copy-toast-close",
      });
    })();
  </script>
</body>
</html>
